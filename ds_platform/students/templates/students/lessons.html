{% extends 'base.html' %}

{% block title %}{{title}}{% endblock %}

{% block content %}

<h1>Мои уроки:</h1>
<ul>
{% for lesson in lessons %}
    <li><a href="{% url 'lesson-detail' lesson.pk %}">{{ lesson.date|date:"d-m-Y" }} |  {{ lesson.subject.name }} | {{ lesson.theme }}</a></li>
{% endfor %}
</ul>
{% endblock %}
