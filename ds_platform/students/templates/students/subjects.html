{% extends 'base.html' %}

{% block title %}{{title}}{% endblock %}

{% block content %}

<div class="parent-subject">
    {% for subject in subjects %}
        <a href="{% url  %}">
        <span class="subject">
            <div class="subject-image"><img src="{{ subject.path }}"></div>
            <div class="subject-name">{{ subject.name }}</div>
        </span>
        </a>
    {% endfor %}
</div>

{% endblock %}
