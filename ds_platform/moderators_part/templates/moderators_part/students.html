{% extends 'base.html' %}

{% block title %}{{title}}{% endblock %}

{% block content %}

<h1 class="center-header">Ученики</h1>

{% for student in students %}
    {% if not student.is_staff %}
        <p><a href="{% url 'moder:student-detail' student.pk %}">{{ student.last_name }} {{ student.first_name }}, {{ student.school_class }} кл.</a></p>
    {% endif %}
{% endfor %}

{% endblock %}
